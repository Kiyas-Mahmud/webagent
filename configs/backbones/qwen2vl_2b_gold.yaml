# Qwen2-VL-2B QLoRA on the GOLD dataset (real, leak-safe). Separate from the
# synthetic config; the synthetic pipeline is untouched.
#   honest input = state_before + state_after images + task_description only.

name: Y_QWEN2VL_2B_GOLD
extends: backbones/qwen2vl_2b.yaml

data:
  # Set at runtime / on Kaggle to the gold dataset folder, e.g.
  #   /kaggle/input/datasets/<you>/webagentgold/web_agent_gold_v8_approved_2032_real_browser
  root: data/web_agent_gold_v8_approved_2032_real_browser
  train_json: split_train.json
  val_json: split_val.json
  test_json: split_test.json
  use_state_after: true             # before+after images (the real visual signal)
  use_visual_diff_text: false       # never; gold split files carry no scalar anyway

# Disable the 3 heads gold has no labels for (placeholders never train).
# Active: outcome, failure_type, action, bbox, recovery, calibration, contrastive.
loss:
  confidence: 0.0
  memory_flag: 0.0
  recovery_outcome: 0.0

train:
  metrics_csv: results/gold_metrics.csv
