# Qwen2-VL-2B QLoRA on the GOLD dataset (real, leak-safe). Separate from the
# synthetic config; the synthetic pipeline is untouched.
#   causal inputs:
#     pre-action  = state_before + task/domain
#     post-action = state_before + state_after + task/domain
#   Both paths share one VLM+adapter; no label is fed into either path.

name: Y_QWEN2VL_2B_GOLD
extends: backbones/qwen2vl_2b.yaml

data:
  # Set at runtime / on Kaggle to the gold dataset folder (auto-detected in the notebook).
  #   v14 (current): data/gold_v14/gold_v14  (Kaggle dataset: webgoldv3)
  root: data/gold_v14/gold_v14
  train_json: split_train.json
  val_json: split_val.json
  test_json: split_test.json
  use_state_after: true             # before+after images (the real visual signal)
  use_visual_diff_text: false       # never; gold split files carry no scalar anyway
  causal_routing: true              # future image cannot reach action/bbox/confidence-before

# v14 has real confidence + memory + recovery_success labels -> ALL 4 pillars ON.
# recovery_success is masked in the loss (only attempted rows) + pos_weight for imbalance.
loss:
  confidence: 0.05
  memory_flag: 0.10
  recovery_outcome: 0.09
  # Recovery strategy is dominated by NONE. The Gold runner derives normalized
  # sqrt-inverse-frequency weights from the selected training rows only.
  recovery_weight_scheme: sqrt_inverse_frequency
  recovery_weight_cap: 3.0

train:
  metrics_csv: results/gold_metrics.csv
  early_stop_metric: outcome_mcc
  controlled_experiment_tag: recovery_v1
