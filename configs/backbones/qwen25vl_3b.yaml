# Qwen2.5-VL-3B-Instruct (4-bit / QLoRA) — FOUNDATION RUN (Qwen-first build order).
# Unified VLM: uses the adapter path (SPEC 4.5), skips cross-attention fusion.
#   VLM(image+text) -> pooled[D] -> Adapter Linear(D->768) -> 4 heads (FIXED)
# Inherits configs/base.yaml; only fields below override.
#
# NOTE: Qwen2.5-VL ships 3B/7B/72B only — there is no 0.5B VL model. 3B in 4-bit
# (~3-4 GB weights) fits free Kaggle T4 16 GB.

name: Y_QWEN3B
extends: base.yaml

backbone:
  path: vlm                                   # selects the VLM adapter path
  vlm_model: Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true                          # bitsandbytes nf4, bf16 compute
  qlora: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  # attention + MLP projections (plan P2-A), not just q/v.
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  pooling: last                               # last non-pad token; mean|attention for ablation (P0-A)
  vlm_hidden_dim: 2048                        # D; adapter maps D->768. VERIFY at load.
  # Cap vision tokens — screenshots are only 256px wide, so keep them small.
  min_pixels: 50176                           # 224*224
  max_pixels: 200704                          # 448*448

data:
  use_state_after: false                      # set true for before+after input ablation (P0-B)

adapter:
  dropout: 0.1

# ---- 10-term combined loss (mirrors qwen2vl_2b; base.yaml only defines 7) ----
loss:
  outcome: 0.22
  failure_type: 0.18
  action_type: 0.15
  bbox: 0.10
  memory_flag: 0.10
  recovery: 0.09
  confidence: 0.05
  calibration: 0.05
  contrastive: 0.04
  recovery_outcome: 0.05
  label_smoothing: 0.1
  class_weight_action: true
  class_weight_failure_type: true
  confidence_clip: [0.05, 0.95]
  contrastive_mode: supervised
  contrastive_temp: 0.1
  contrastive_margin: 0.5

train:
  epochs: 15
  early_stop_metric: failure_f1
  early_stop_patience: 3
  checkpoint_every_steps: 500
  keep_top_k: 3
  log_every: 50
  metrics_csv: results/qwen25vl3b_metrics.csv

optim:
  batch_size: 2                               # VLM is heavy on T4
  grad_accum: 16                              # effective batch 32
  mixed_precision: bf16                       # bf16 compute with 4-bit base
  lr_lora: 1.0e-4                             # LoRA + adapter param group
  lr_heads: 1.0e-3                            # task heads param group

seeds: [42]
