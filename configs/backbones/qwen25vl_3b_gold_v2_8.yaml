# Qwen2.5-VL-3B adapter-path candidate on the reviewed Gold v2.8 protocol.
#
# This keeps the causal routing, hierarchical recovery, source-aware supplement,
# spatial grounding, fixed heads and loss from the proven Qwen2-VL-2B config.
# It is a candidate for smoke -> mini -> full in that order; the DGX notebook
# deliberately blocks its full stage until separate smoke/mini evidence exists.
name: Y_QWEN25VL_3B_GOLD_V2_8
extends: backbones/qwen2vl_2b_gold_v2_8.yaml

backbone:
  path: vlm
  vlm_model: Qwen/Qwen2.5-VL-3B-Instruct
  load_in_4bit: true
  dtype: bfloat16
  qlora: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  pooling: last
  vlm_hidden_dim: 2048
  min_pixels: 100352
  max_pixels: 501760
  preserve_spatial_tokens: true

optim:
  batch_size: 2
  grad_accum: 16
  mixed_precision: bf16
  lr_lora: 1.0e-4
  lr_heads: 1.0e-3

train:
  controlled_experiment_tag: recovery_v2_8
  metrics_csv: results/qwen25vl_3b_gold_recovery_v2_8_metrics.csv
