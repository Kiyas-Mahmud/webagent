# Qwen2.5-VL-7B candidate for the reviewed Gold v2.8 comparison.
#
# The data, causal routing, heads, losses, selection gates, and validation
# isolation are inherited unchanged.  Only the unified VLM front-end and the
# physical micro-batch differ.  QLoRA keeps the effective batch at 32.
name: Y_QWEN25VL_7B_GOLD_V2_8_DGX
extends: backbones/qwen2vl_2b_gold_v2_8.yaml

backbone:
  path: vlm
  family: qwen2_vl
  vlm_model: Qwen/Qwen2.5-VL-7B-Instruct
  revision: cc594898137f460bfe9f0759e9844b3ce807cfb5
  trust_remote_code: false
  load_in_4bit: true
  dtype: bfloat16
  qlora: true
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  pooling: last
  vlm_hidden_dim: 3584
  min_pixels: 50176
  max_pixels: 200704
  preserve_spatial_tokens: true
  forward_logits_to_keep: 1
  attn_implementation: sdpa

optim:
  batch_size: 4
  grad_accum: 8
  mixed_precision: bf16
  lr_lora: 1.0e-4
  lr_heads: 1.0e-3

train:
  epochs: 10
  checkpoint_every_steps: 50
  controlled_experiment_tag: qwen25vl_7b_recovery_v2_8
  execution_profile: dgx_gb10_qwen25vl_7b_v1
  metrics_csv: results/qwen25vl_7b_gold_v2_8_metrics.csv

