[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web_agent"
version = "0.1.0"
description = "Failure-Aware Resilient Autonomous Web Agent (4-pillar, backbone-agnostic)"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.57.6,<5",
    "accelerate",
    "peft",
    "bitsandbytes",
    "pillow",
    "numpy",
    "pandas",
    "scikit-learn",
    "tqdm",
    "faiss-cpu",
    "matplotlib",
    "seaborn",
    "pyyaml",
    "wandb",
    "packaging",
]

[project.optional-dependencies]
dev = ["pytest"]
table2 = [
    "browsergym-core==0.14.3",
    "browsergym-webarena==0.14.3",
    "cryptography==46.0.5",
    "gymnasium==1.0.0",
    "libwebarena==0.0.4",
    "playwright==1.44.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"web_agent.eval.table2" = ["deployment_authority_registry_v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[project.scripts]
web-agent = "web_agent.train.train:main"
